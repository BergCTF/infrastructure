apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  # if we call this berg it clashes with the berg api service account
  name: gw-berg
  namespace: berg
spec:
  gatewayClassName: kgateway
  infrastructure:
    parametersRef:
      name: berg
      group: gateway.kgateway.dev
      kind: GatewayParameters
  listeners:
  - allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            app.kubernetes.io/part-of: infra
    name: http
    port: 80
    protocol: HTTP
  - allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            app.kubernetes.io/part-of: infra
    name: https
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - group: ""
        kind: Secret
        name: berg-gateway-tls
      mode: Terminate
  - allowedRoutes:
      namespaces:
        from: All
    name: https-chall
    port: 1337
    protocol: HTTPS
    tls:
      certificateRefs:
      - group: ""
        kind: Secret
        name: berg-gateway-tls
      mode: Terminate
  - allowedRoutes:
      namespaces:
        from: All
    name: tls-chall
    port: 31337
    protocol: TLS
    tls:
      certificateRefs:
      - group: ""
        kind: Secret
        name: berg-gateway-tls
      mode: Terminate
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: berg
  namespace: berg
spec:
  kube:
    service:
      type: LoadBalancer
      {{- if .Values.gateway.hetzner.enabled }}
      extraAnnotations:
        load-balancer.hetzner.cloud/uses-proxyprotocol: "true"
        load-balancer.hetzner.cloud/name: {{ .Values.gateway.hetzner.loadBalancerName | default (printf "gateway.%s" .Values.domains.cluster) | quote }}
      {{- end }}
    envoyContainer:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: ListenerPolicy
metadata:
  name: berg-ccm-policy
  namespace: berg
spec:
  default:
    {{- if .Values.gateway.hetzner.enabled }}
    proxyProtocol: {}
    {{- end }}
    httpSettings:
      {{- if .Values.gateway.hetzner.enabled }}
      useRemoteAddress: true
      {{- end }}
      upgradeConfig:
        enabledUpgrades:
          - websocket
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gw-berg

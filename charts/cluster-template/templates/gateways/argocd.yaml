apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: infra-argocd
spec:
  parentRefs:
    - name: gw-berg
      namespace: berg
      sectionName: https
    - name: gw-berg
      namespace: berg
      sectionName: http
  hostnames:
    - argocd.{{ .Values.domains.cluster }}
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80

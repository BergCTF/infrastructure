# domains:
  # cluster domain is used to derive infrastructure component domains
  # cluster: env.example.com
  # mail: example.com
  # berg: example.com
# env: prod

# self referential infrastructure link
infra:
  # repo: git@github.com:example/infrastructure.git
  # path: manifests/<environment>

ctf:
  name: My CTF
  description: |
    flags
  organiser: berg

challenges:
  # whether to deploy the configured challenge repository
  enabled: false
  # repo: git@github.com:<YOUR-ORG>/challenges.git

berg:
  enabled: true
  anonymousAccess: false
  # chart version - defaults to Chart.AppVersion
  # version: 
  ctf:
    start: "2050-10-05T23:59:59+02:00"
    end: "2099-10-05T23:59:59+02:00"
  oidc:
    enabled: true
  discordAuth:
    enabled: false
    playerGuildId: "0"
    playerRoleId: "0"
    authorGuildId: "0"
    authorRoleId: "0"
    adminGuildId: "0"
    adminRoleId: "0"
  database:
    replicas: 1
    size: 10Gi
    backups:
      enabled: false
      s3:
        # bucketName: 
        # region: 
        # endpoint
  # raw pages
  pages: {}

challengeInstanceController:
  enabled: true
  clusterWide: true

authentik:
  enabled: true
  # enable smtp support (expects an existing Kubernetes Secret)
  smtp: false
  database:
    replicas: 1
    size: 10Gi
    backups:
      enabled: false
      s3:
        # bucketName: 
        # region: 
        # endpoint

observability:
  enabled: false
  loki:
    s3:
      # bucketName: 
      # region: 
      # endpoint
  mimir:
    s3:
      # bucketName: 
      # region: 
      # endpoint
  tempo:
    s3:
      # bucketName: 
      # region: 
      # endpoint

certManager:
  enabled: true
  defaultClusterIssuer: letsencrypt-prod-dns
  clusterIssuers:
    - name: letsencrypt-prod-dns
      spec:
        acme:
          # email: admin@bergctf.io
          privateKeySecretRef:
            name: letsencrypt-prod-dns
          server: https://acme-v02.api.letsencrypt.org/directory
          solvers:
            - dns01:
                cloudflare:
                  apiTokenSecretRef:
                    name: dns-api-key
                    key: api-token
                # webhook:
                #   solverName: hetzner
                #   groupName: acme.hetzner.com
                #   config:
                #     tokenSecretKeyRef:
                #       name: dns-api-key
                #       key: api-token

gateway:
  hetzner:
    enabled: false
    # Optional. Defaults to gateway.<cluster domain>.
    loadBalancerName: ""

dns:
  externalDnsEnabled: false
  # cloudflare or hetzner, used for external-dns and cert-manager
  provider: cloudflare
